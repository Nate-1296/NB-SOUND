[workspace]
members = ["crates/nb-protocol", "crates/nb-capability"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
nb-protocol = { version = "=0.1.0", path = "crates/nb-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
getrandom = "0.3.4"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = { version = "1.9.0", features = ["serde"] }
rustix = { version = "1.1.6", features = ["process"] }
interprocess = { version = "2.4.8", features = ["tokio"] }
windows-token = "0.2.1"
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_Foundation"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
