# Política de licencias y seguridad de las dependencias de Rust (ADR-010).
# NB Sound es GPL-3.0-or-later: admite todo lo compatible con ella. Lo mismo que
# NB Books más GPL-3.0, que aquí sí cabe (por ejemplo, songrec).

[advisories]
version = 2
yanked = "deny"
# Sin mantenimiento, vía el árbol de Tauri: no es dependencia nuestra y no hay
# versión a la que saltar. Revisado el 2026-10-29 con cargo-deny; las otras cinco
# que acepta NB Books no aparecen en este árbol.
ignore = [
  # La copia de SQLite que integra `libsqlite3-sys` 0.38. El arreglo está en 0.39, que
  # pide rusqlite 0.41, y `r2d2_sqlite` 0.35 (el último publicado) sigue atado a
  # rusqlite 0.40 (ADR-004). Decisión de Nathan del 2026-11-09: se ignora hasta que
  # salga un r2d2_sqlite compatible; entonces se sube y se quita esta línea.
  "RUSTSEC-2026-0459", # libsqlite3-sys
  "RUSTSEC-2024-0370", # proc-macro-error
  # `zvariant`, `zvariant_derive` y `zbus_names` no tienen fallo: se fundieron en
  # zbus 6 y dejaron de publicarse sueltos. Llegan por `keyring` 4.2 (ADR-009),
  # que aún depende de zbus 5. Revisado el 2026-10-30; se quitan al subir keyring.
  "RUSTSEC-2026-0370", # zvariant
  "RUSTSEC-2026-0371", # zbus_names
  "RUSTSEC-2026-0372", # zvariant_derive
  # `paste` está archivado, no roto: es una macro de compilación que no llega al
  # binario. La trae `lofty` 0.25 (ADR-002). Revisado el 2026-10-30.
  "RUSTSEC-2024-0436", # paste
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "GPL-3.0-or-later",
  "GPL-3.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
